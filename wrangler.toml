# Cloudflare Pages stubs for Yeh Bro Instagram approve desk.
# Replace placeholder IDs after creating KV + R2 in the CF dashboard.
# Secrets (set in Pages → Settings → Environment variables / Secrets — never commit values):
#   ADMIN_SOCIAL_PASSWORD   required — password gate for /admin/social
#   ZERNIO_API_KEY          optional — enables Post approved → Zernio publish to @theyehbro
#   ADMIN_SOCIAL_FIXTURE    optional — "1" forces fixture data even with bindings

name = "yeh-bro"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "IG_QUEUE"
id = "REPLACE_WITH_IG_QUEUE_KV_ID"
preview_id = "REPLACE_WITH_IG_QUEUE_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "IG_MEDIA"
bucket_name = "yehbro-ig-queue"
preview_bucket_name = "yehbro-ig-queue-preview"
