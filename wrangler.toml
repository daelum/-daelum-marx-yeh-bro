# Yeh Bro — Cloudflare Worker + static assets (Astro SSG) + admin Functions.
#
# Root cause of “Variables cannot be added to a Worker that only has static assets”:
# classic Pages `functions/` alone is ignored when the project is assets-only.
# We compile `functions/` into a Worker entrypoint (`main`) so secrets/KV/R2 unlock.
#
# Secrets (dashboard or `wrangler secret put` — never commit values):
#   ADMIN_SOCIAL_PASSWORD   required — password gate for /admin/social
#   ZERNIO_API_KEY          required for live Approve→IG — single-item Zernio publish to @theyehbro
#   ADMIN_SOCIAL_FIXTURE    optional — "1" forces fixture data even with bindings
#
# Bindings must be declared here. Dashboard-only bindings are undefined on
# Workers+assets deploys and previously caused silent fixture mode (7 fake items).
#   IG_QUEUE  → KV namespace yehbro-ig-queue
#               (day:{key}, index:days, pool:refill, refill:needed)
#   IG_MEDIA  → R2 bucket yehbro-ig-media ({day}/… + pool/…)
#
# `name` must match the Workers project that serves yehbro.com.

name = "daelum-marx-yeh-bro"
compatibility_date = "2025-10-01"
main = "./dist-worker/index.js"
upload_source_maps = true

[[kv_namespaces]]
binding = "IG_QUEUE"
id = "cbc2ba4244bd4bb3ab3394a0809d0b7e"

[[r2_buckets]]
binding = "IG_MEDIA"
bucket_name = "yehbro-ig-media"

[assets]
directory = "./dist"
binding = "ASSETS"
# Prefer Astro’s generated 404 for unknown public routes.
not_found_handling = "404-page"
# Asset layer returns 405 for non-GET on non-files; force admin APIs through the Worker.
run_worker_first = [
	"/admin/social/api/*",
	"/admin/social/media/*",
]
